<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Item odds</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="top">
    <h1>Item odds <span class="version">v1.0.9</span></h1>
    <p class="note">Loot% changes the chance a drop happens. It does not change the suffix roll. <a href="drops.html">All item drops</a></p>
  </header>

  <main class="board">
    <section class="picker">
      <input id="search" type="search" placeholder="Find an item" autocomplete="off">
      <select id="list" size="16"></select>
    </section>

    <section class="work">
      <div class="identity">
        <canvas id="sprite" width="16" height="16"></canvas>
        <div id="meta"></div>
      </div>

      <div class="fields">
        <label>Forge <input id="forge" type="number" min="0" max="10" value="0"></label>
        <label id="tormentField">Torment <input id="torment" type="number" min="0" max="9999" value="0"></label>
        <label id="blightField" hidden>Blightforged <input id="blight" type="checkbox"> <span id="blightNote"></span></label>
        <label>Loot % <input id="loot" type="number" min="0" max="100" value="0" step="1"></label>
        <label>Rarity
          <select id="rarity"></select>
        </label>
        <label>Class
          <select id="class"></select>
        </label>
        <label>Land
          <input id="land" type="number" min="1" max="10" value="4">
        </label>
        <label>Drop from
          <select id="source">
            <option value="fight">fight</option>
            <option value="elite">elite</option>
            <option value="boss">boss</option>
            <option value="treasure">treasure</option>
          </select>
        </label>
      </div>

      <p id="blightDisclaimer" class="disclaimer" hidden>Blightforged items' stats may be lower than the lowest displayed here. This is because blightforged multiplier varies, highest is 1.7x</p>

      <fieldset class="suffixes">
        <legend>Suffixes</legend>
        <div class="modes">
          <label><input type="radio" name="mode" value="random" checked> random</label>
          <label><input type="radio" name="mode" value="atleast"> at least these</label>
          <label><input type="radio" name="mode" value="exact"> this exact set</label>
        </div>
        <div id="affixes"></div>
      </fieldset>
    </section>

    <section class="readout">
      <div class="panel">
        <h2>Default stats <button type="button" id="reroll">Reroll suffixes</button></h2>
        <div id="stats"></div>
      </div>
      <div class="panel">
        <h2>Drop</h2>
        <div id="drop"></div>
      </div>
      <div class="panel odds">
        <h2>Suffix odds</h2>
        <div id="suffix"></div>
      </div>
    </section>
  </main>

  <script src="catalog.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
